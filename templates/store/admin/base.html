<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex,nofollow" />
        <title>{% block title %}Store admin{% endblock %} | PSV</title>
        <link rel="icon" type="image/png" href="/static/psv-compact-logo.png" />
        <link href="/static/styles.css" rel="stylesheet" />
        <link href="/static/pages/store-admin.css" rel="stylesheet" />
        <script
            async
            crossorigin="anonymous"
            data-clerk-publishable-key="{{ clerk.publishable_key }}"
            src="https://{{ clerk.frontend_api }}/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
        ></script>
        <script src="/static/pages/store-admin.js" defer></script>
    </head>

    <body class="admin">
        <header class="admin-bar">
            <a class="admin-brand" href="{{ url_for('store_admin_dashboard') }}">PSV store admin</a>
            {% if signed_in %}
                <nav class="admin-nav" aria-label="Admin">
                    {% if admin %}
                        <a href="{{ url_for('store_admin_dashboard') }}">Products</a>
                        <a href="{{ url_for('store_admin_orders') }}">Orders</a>
                        <a href="{{ url_for('store_page') }}">View store</a>
                    {% endif %}
                    <button
                        type="button"
                        class="admin-link-button"
                        data-sign-out="{{ url_for('store_admin_login') }}?notice=signed_out"
                    >Sign out</button>
                </nav>
            {% endif %}
        </header>

        <main class="admin-main">
            {% if notice %}<p class="admin-notice" role="status">{{ notice }}</p>{% endif %}
            {% if error %}<p class="admin-error" role="alert">{{ error }}</p>{% endif %}
            {% block main %}{% endblock %}
        </main>
    </body>
</html>
