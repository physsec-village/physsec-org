<div class="cart-overlay" id="cartOverlay" hidden></div>
<aside
    class="cart-drawer"
    id="cartDrawer"
    role="dialog"
    aria-modal="true"
    aria-label="Shopping cart"
    hidden
>
    <div class="cart-head">
        <div class="cart-title">Your Cart</div>
        <button class="cart-close" id="cartClose" aria-label="Close cart">
            <svg viewBox="0 0 24 24">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </button>
    </div>
    <div class="cart-body">
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-empty" id="cartEmpty" hidden>
            <svg viewBox="0 0 24 24">
                <circle cx="9" cy="21" r="1" />
                <circle cx="20" cy="21" r="1" />
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
            </svg>
            <p>Your cart is empty. Add some tools to get started.</p>
        </div>
    </div>
    <div class="cart-foot" id="cartFoot" hidden>
        <div class="cart-subtotal-row">
            <span>Subtotal</span>
            <span class="cart-subtotal" id="cartSubtotal">$0.00</span>
        </div>
        <p class="cart-fineprint">
            Shipping &amp; taxes calculated at checkout. Prices shown are
            placeholders for design review.
        </p>
        <a href="{{ url_for('store_checkout_page') }}" class="btn btn-primary cart-checkout" id="cartCheckout">
            Checkout · <span id="cartCheckoutTotal">$0.00</span>
        </a>
        <button class="btn btn-ghost cart-clear" id="cartClear">Clear cart</button>
    </div>
</aside>
<script id="psv-catalog" type="application/json">{{ catalog_json | tojson }}</script>
<script src="/static/pages/store.js"></script>
