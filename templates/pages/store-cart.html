{% extends "base.html" %} {% block styles %}
<link href="/static/pages/store-cart.css" rel="stylesheet" />
{% endblock %}

{% block page_header %}
    <div class="page-header-inner">
        <div class="breadcrumb">
            <a href="/">Home</a>
            <span>/</span>
            <a href="/store">Store</a>
            <span>/</span>
            <span>Cart</span>
        </div>
        <h1 class="page-title">Your Cart</h1>
    </div>
{% endblock %}

{% block main %}
    <div class="cart-inner">
        <div class="cart-wrap" id="cartWrap"></div>
        <div class="cart-error" id="cartError"></div>
    </div>
    <script>
        function renderCartPage() {
            const wrap = document.getElementById("cartWrap");
            if (!window.PSVCart) return;

            const items = PSVCart.getItems();

            if (items.length === 0) {
                wrap.innerHTML = `
                    <div class="cart-empty">
                        <svg viewBox="0 0 24 24">
                            <circle cx="9" cy="21" r="1"/>
                            <circle cx="20" cy="21" r="1"/>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                        </svg>
                        <p>Your cart is empty.</p>
                        <a href="/store" class="btn btn-outline">Browse Store</a>
                    </div>
                `;
                return;
            }

            const itemsHtml = items
                .map(
                    (item) => `
                    <div class="cart-item" data-slug="${item.slug}">
                        <div class="cart-item-info">
                            <div class="cart-item-name">
                                <a href="/store/${item.slug}">${item.name}</a>
                            </div>
                            <div class="cart-item-unit-price">${item.price_display} each</div>
                        </div>
                        <div class="qty-control">
                            <button class="qty-btn" onclick="updateQty('${item.slug}', ${item.quantity - 1})" aria-label="Decrease quantity">&minus;</button>
                            <span class="qty-value">${item.quantity}</span>
                            <button class="qty-btn" onclick="updateQty('${item.slug}', ${item.quantity + 1})" aria-label="Increase quantity">+</button>
                        </div>
                        <div class="cart-item-total">${PSVCart.formatCents(item.price_cents * item.quantity)}</div>
                        <button class="cart-item-remove" onclick="removeItem('${item.slug}')" aria-label="Remove item">
                            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>
                `,
                )
                .join("");

            wrap.innerHTML = `
                <div class="cart-items">${itemsHtml}</div>
                <div class="cart-summary">
                    <span class="cart-subtotal-label">Subtotal</span>
                    <span class="cart-subtotal-value">${PSVCart.formatCents(PSVCart.getSubtotalCents())}</span>
                </div>
                <div class="cart-actions">
                    <a href="/store" class="btn btn-outline">Continue Shopping</a>
                    <button class="btn btn-primary" onclick="checkout()" id="checkoutBtn">
                        <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                        Proceed to Checkout
                    </button>
                </div>
            `;
        }

        function updateQty(slug, qty) {
            if (qty < 1) {
                PSVCart.removeItem(slug);
            } else {
                PSVCart.updateQuantity(slug, qty);
            }
            renderCartPage();
        }

        function removeItem(slug) {
            PSVCart.removeItem(slug);
            renderCartPage();
        }

        async function checkout() {
            const items = PSVCart.getItems().map((i) => ({
                slug: i.slug,
                quantity: i.quantity,
            }));
            if (items.length === 0) return;

            const btn = document.getElementById("checkoutBtn");
            const errEl = document.getElementById("cartError");
            btn.disabled = true;
            btn.textContent = "Redirecting...";
            errEl.style.display = "none";

            try {
                const res = await fetch("/store/checkout", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ items }),
                });
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.error || "Checkout failed");
                }
                window.location.href = data.checkout_url;
            } catch (err) {
                errEl.textContent = err.message;
                errEl.style.display = "block";
                btn.disabled = false;
                btn.innerHTML = `
                    <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                    Proceed to Checkout
                `;
            }
        }

        if (window.PSVCart) renderCartPage();
    </script>
{% endblock %}
