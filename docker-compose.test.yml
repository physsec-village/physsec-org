services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: psv_test
      POSTGRES_PASSWORD: psv_test_password
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d psv_test"]
      interval: 2s
      timeout: 3s
      retries: 15
