server {
    listen 8080 default_server;
    server_name ~^pr-(?<preview_id>[1-9][0-9]{0,3})\.physsec\.org$;

    # Docker's embedded DNS resolves the network alias assigned by each
    # preview Compose project. A variable defers resolution until request time.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $preview_upstream pr-$preview_id:8080;

    location / {
        proxy_pass http://$preview_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
