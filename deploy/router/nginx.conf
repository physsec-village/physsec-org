events {}

http {
    # Docker's embedded DNS is required because the active slot is selected
    # through a variable. A short validity period also survives slot recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        include /etc/nginx/active/slot.conf;

        location / {
            # The host nginx is the trust boundary: it has already replaced
            # these values with the real client and public scheme. Preserve
            # them rather than replacing them with this container's address.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            add_header X-PSV-Slot $active_backend always;
            proxy_pass http://$active_backend;
        }
    }
}
