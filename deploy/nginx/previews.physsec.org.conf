# Exact DNS records are managed by the preview workflow; arbitrary hostnames do
# not match this server block. The preview gateway resolves containers by their
# dedicated Docker network aliases.
server {
    listen 80;
    listen [::]:80;
    server_name ~^pr-(?<preview_id>[1-9][0-9]{0,3})\.physsec\.org$;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ~^pr-(?<preview_id>[1-9][0-9]{0,3})\.physsec\.org$;

    # A Let's Encrypt certificate for physsec.org and *.physsec.org is valid
    # for these first-level preview hostnames and for Full (strict) origin TLS.
    ssl_certificate /etc/letsencrypt/live/physsec.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/physsec.org/privkey.pem;

    server_tokens off;
    client_max_body_size 64k;
    include /etc/nginx/snippets/physsec-security-headers.conf;

    location / {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
