# Dev environment virtual host. The dev colours listen on 127.0.0.1:8081 (blue)
# and 127.0.0.1:8083 (green).
# Keep private keys and generated certificate material outside the repository.

# Blue/green upstream. deploy/deploy.sh rewrites the include to point at the
# active colour's loopback port and reloads nginx; see deploy/README.md.
upstream psv_dev {
    include /etc/nginx/psv-upstreams/dev.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name dev.physsec.org;

    # 308 preserves the request method across the redirect, unlike 301.
    return 308 https://dev.physsec.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.physsec.org;

    ssl_certificate /etc/nginx/host-certs/dev.physsec.org.cert.pem;
    ssl_certificate_key /etc/nginx/host-certs/dev.physsec.org.key.pem;

    server_tokens off;
    client_max_body_size 64k;

    include /etc/nginx/snippets/physsec-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Match the compression policy already used on the production host.
    gzip on;
    gzip_types text/css text/scss text/plain text/xml application/xml application/json application/javascript;

    location = /robots.txt {
        # add_header inside a location suppresses inherited add_header
        # directives, so the security snippet must be included here too.
        include /etc/nginx/snippets/physsec-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_redirect off;
        proxy_pass http://psv_dev;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Deliberately replace, rather than append to, untrusted client input.
        # The application uses this address for per-IP rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
