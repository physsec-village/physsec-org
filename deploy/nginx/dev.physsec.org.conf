# TLS material is host-managed and must not be committed to this repository.

server {
    listen 80;
    listen [::]:80;
    server_name dev.physsec.org;

    return 308 https://dev.physsec.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.physsec.org;

    ssl_certificate /etc/nginx/host-certs/dev.physsec.org.cert.pem;
    ssl_certificate_key /etc/nginx/host-certs/dev.physsec.org.key.pem;

    server_tokens off;
    client_max_body_size 64k;

    include /etc/nginx/snippets/physsec-security-headers.conf;

    gzip on;
    gzip_types text/css text/scss text/plain text/xml application/xml application/json application/javascript;

    location / {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
