# This file follows the certificate layout used by the production nginx host.
# The certificate must cover both physsec.org and www.physsec.org. Keep private
# keys and generated certificate material outside the repository.

# Blue/green upstream. deploy/deploy.sh rewrites the include to point at the
# active colour's loopback port and reloads nginx; see deploy/README.md.
upstream psv_production {
    include /etc/nginx/psv-upstreams/production.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name physsec.org www.physsec.org;

    # 308 preserves the request method across the redirect, unlike 301.
    return 308 https://physsec.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.physsec.org;

    ssl_certificate /etc/nginx/host-certs/physsec.org.cert.pem;
    ssl_certificate_key /etc/nginx/host-certs/physsec.org.key.pem;

    return 308 https://physsec.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name physsec.org;

    ssl_certificate /etc/nginx/host-certs/physsec.org.cert.pem;
    ssl_certificate_key /etc/nginx/host-certs/physsec.org.key.pem;

    server_tokens off;
    client_max_body_size 64k;

    # The site is proxied through Cloudflare, so the TCP peer is a Cloudflare
    # edge. Restore the visitor's address from CF-Connecting-IP, trusting the
    # header only from Cloudflare's published ranges
    # (https://www.cloudflare.com/ips/, fetched 2026-10-18). Rate limiting and
    # Turnstile's siteverify remoteip both depend on this address.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    include /etc/nginx/snippets/physsec-security-headers.conf;

    # Match the compression policy already used on the production host.
    gzip on;
    gzip_types text/css text/scss text/plain text/xml application/xml application/json application/javascript;

    location / {
        proxy_redirect off;
        proxy_pass http://psv_production;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Deliberately replace, rather than append to, untrusted client input.
        # $remote_addr is the visitor address restored by real_ip above. The
        # application uses it for per-IP rate limiting and Turnstile siteverify.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
