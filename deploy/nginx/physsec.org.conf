# This file follows the certificate layout used by the production nginx host.
# The certificate must cover both physsec.org and www.physsec.org. Keep private
# keys and generated certificate material outside the repository.

# Set at http level: TLS version negotiation can happen against the listen
# socket's default server before SNI selects a virtual host, so a per-server
# ssl_protocols would not reliably cover every block.
ssl_protocols TLSv1.2 TLSv1.3;

server {
    listen 80;
    listen [::]:80;
    server_name physsec.org www.physsec.org;

    # 308 preserves the request method across the redirect, unlike 301.
    return 308 https://physsec.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.physsec.org;

    ssl_certificate /etc/nginx/host-certs/physsec.org.cert.pem;
    ssl_certificate_key /etc/nginx/host-certs/physsec.org.key.pem;

    # Establish HSTS for the www host even though it only redirects. No
    # includeSubDomains; only apex and www are covered by the certificate.
    add_header Strict-Transport-Security "max-age=31536000" always;

    return 308 https://physsec.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name physsec.org;

    ssl_certificate /etc/nginx/host-certs/physsec.org.cert.pem;
    ssl_certificate_key /etc/nginx/host-certs/physsec.org.key.pem;

    server_tokens off;
    client_max_body_size 64k;

    include /etc/nginx/snippets/physsec-security-headers.conf;

    # Match the compression policy already used on the production host.
    gzip on;
    gzip_types text/css text/scss text/plain text/xml application/xml application/json application/javascript;

    location / {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Deliberately replace, rather than append to, untrusted client input.
        # The application uses this address for per-IP rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
