# This file assumes a Let's Encrypt certificate covering physsec.org and
# www.physsec.org. Keep private keys and generated certificate material outside
# the repository.

server {
    listen 80;
    listen [::]:80;
    server_name physsec.org www.physsec.org;

    return 301 https://physsec.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.physsec.org;

    ssl_certificate /etc/letsencrypt/live/physsec.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/physsec.org/privkey.pem;

    return 301 https://physsec.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name physsec.org;

    ssl_certificate /etc/letsencrypt/live/physsec.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/physsec.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 64k;

    include /etc/nginx/snippets/physsec-security-headers.conf;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Deliberately replace, rather than append to, untrusted client input.
        # The application uses this address for per-IP rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
