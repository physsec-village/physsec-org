name: psv-website-dev

services:
  app:
    build: .
    image: psv-website-dev:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:8081:8080"
    env_file:
      - .env.dev
    volumes:
      - ./data-dev/media:/psv-website/data/media
    environment:
      - APP_ENV=production
      - FORWARDED_ALLOW_IPS=172.16.0.0/12
