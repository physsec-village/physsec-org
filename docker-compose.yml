x-app: &app
  build: .
  image: ${APP_IMAGE:-psv-website:latest}
  restart: unless-stopped
  healthcheck:
    # The slim base image has no curl/wget; probe with the stdlib instead.
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 10s
  env_file:
    - .env
  volumes:
    - ./data/media:/psv-website/data/media
  environment:
    # Production startup fails unless Turnstile is fully configured.
    - APP_ENV=production
    # Trust proxy headers only from Docker bridge networks. The router must
    # overwrite, rather than append to, X-Forwarded-For.
    - FORWARDED_ALLOW_IPS=172.16.0.0/12

services:
  app-blue:
    <<: *app

  app-green:
    <<: *app

  # This container owns the stable host port. deploy/deploy.sh only reloads
  # it after the inactive application slot is healthy.
  router:
    image: nginx:1.28.3-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/router/nginx.conf:/etc/nginx/nginx.conf:ro
      # Runtime routing state is ignored by Git, so deployments never dirty
      # the checkout that the next git pull must update.
      - ./data/deploy:/etc/nginx/active:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
