# Blue/green deployment: two identical services publish on different loopback
# ports and deploy/deploy.sh switches the host nginx upstream between them.
# Only the active colour normally runs; each colour has its own profile so a
# bare `docker compose up` does not start both. Locally, run one colour with
# `docker compose --profile blue up --build`.
#
# PSV_IMAGE, PSV_BLUE_PORT, PSV_GREEN_PORT, and COMPOSE_PROJECT_NAME are set
# in each checkout's .env for Compose interpolation, so dev can run beside
# prod. Production uses the defaults.
x-app: &app
  build: .
  # Both colours build and tag the same image name; a colour keeps serving from
  # the image ID it started with until it is replaced.
  image: ${PSV_IMAGE:-psv-website}:latest
  restart: unless-stopped
  healthcheck:
    # The slim base image has no curl/wget; probe with the stdlib instead.
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 10s
  env_file:
    - .env
  volumes:
    - ./data/media:/psv-website/data/media
  environment:
    # Production startup fails unless Turnstile is fully configured.
    - APP_ENV=production
    # Trust proxy headers only from Docker bridge networks. The reverse
    # proxy must overwrite, rather than append to, X-Forwarded-For.
    - FORWARDED_ALLOW_IPS=172.16.0.0/12

services:
  blue:
    <<: *app
    profiles: [blue]
    ports:
      - "127.0.0.1:${PSV_BLUE_PORT:-8080}:8080"
  green:
    <<: *app
    profiles: [green]
    ports:
      - "127.0.0.1:${PSV_GREEN_PORT:-8082}:8080"
