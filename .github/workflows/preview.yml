name: Preview environment

on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    environment:
      name: previews
      url: https://pr-${{ github.event.pull_request.number }}.physsec.org
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Deploy preview to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            ./deploy/deploy-preview.sh \
              "${{ github.event.pull_request.number }}" \
              "${{ github.event.pull_request.head.sha }}" \
              "${{ secrets.PREVIEW_ROOT }}" \
              "${{ secrets.PREVIEW_ENV_FILE }}"

      - name: Create or update preview DNS
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          PREVIEW_HOST: pr-${{ github.event.pull_request.number }}.physsec.org
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records"
          record_id="$(curl --fail-with-body --silent --show-error \
            --get "${api}" \
            --header "Authorization: Bearer ${CF_API_TOKEN}" \
            --data-urlencode "type=CNAME" \
            --data-urlencode "name=${PREVIEW_HOST}" | jq -r '.result[0].id // empty')"
          body="$(jq -cn --arg name "${PREVIEW_HOST}" \
            '{type:"CNAME", name:$name, content:"physsec.org", ttl:1, proxied:true, comment:"GitHub PR preview"}')"
          if [ -n "${record_id}" ]; then
            endpoint="${api}/${record_id}"
            method=PUT
          else
            endpoint="${api}"
            method=POST
          fi
          curl --fail-with-body --silent --show-error \
            --request "${method}" "${endpoint}" \
            --header "Authorization: Bearer ${CF_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "${body}" >/dev/null

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: previews
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Remove preview DNS
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          PREVIEW_HOST: pr-${{ github.event.pull_request.number }}.physsec.org
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records"
          curl --fail-with-body --silent --show-error \
            --get "${api}" \
            --header "Authorization: Bearer ${CF_API_TOKEN}" \
            --data-urlencode "type=CNAME" \
            --data-urlencode "name=${PREVIEW_HOST}" |
            jq -r '.result[].id' |
            while read -r record_id; do
              curl --fail-with-body --silent --show-error \
                --request DELETE "${api}/${record_id}" \
                --header "Authorization: Bearer ${CF_API_TOKEN}" >/dev/null
            done

      - name: Remove preview from VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            ./deploy/cleanup-preview.sh \
              "${{ github.event.pull_request.number }}" \
              "${{ secrets.PREVIEW_ROOT }}" \
              "${{ secrets.PREVIEW_ENV_FILE }}"
