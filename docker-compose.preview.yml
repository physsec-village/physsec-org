services:
  app:
    # The Compose definition comes from the trusted base checkout; only the
    # build context comes from the pull request worktree.
    build: ${PREVIEW_CONTEXT:?PREVIEW_CONTEXT is required}
    image: psv-website-preview-${PREVIEW_ID:?PREVIEW_ID is required}:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    env_file:
      - ${PREVIEW_ENV_FILE:?PREVIEW_ENV_FILE is required}
    volumes:
      - preview-media:/psv-website/data/media
    environment:
      - APP_ENV=production
      - FORWARDED_ALLOW_IPS=172.16.0.0/12
      - STORE_ENABLED=false
      - STORE_PUBLIC_ORIGIN=https://pr-${PREVIEW_ID}.physsec.org
      - TURNSTILE_ALLOWED_HOSTNAMES=pr-${PREVIEW_ID}.physsec.org
    networks:
      previews:
        aliases:
          - pr-${PREVIEW_ID}

volumes:
  preview-media:

networks:
  previews:
    external: true
    name: psv-previews
