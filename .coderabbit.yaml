# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  # Keep binary assets out of review scope so large PRs stay under the file limit.
  path_filters:
    - "!**/*.webp"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.gif"
    - "!**/*.ico"
    - "!**/*.svg"
    - "!**/*.woff"
    - "!**/*.woff2"
    - "!**/*.pdf"
    - "!**/*.lock"
